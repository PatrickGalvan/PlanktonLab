[project]
name = "planktonlab"
version = "1.0.0"
description = "Local zooplankton image classification and training workspace"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Flask==3.1.2",
    "Flask-Minify==0.50",
    "Flask-SQLAlchemy==3.1.1",
    "MarkupSafe==3.0.2",
    "markdown-it-py==4.0.0",
    "numpy==2.2.6",
    "opencv-python-headless==4.12.0.88",
    "pillow==11.3.0",
    "platformdirs==4.4.0",
    "requests==2.32.5",
    "SQLAlchemy==2.0.43",
    "truststore==0.10.4",
    "waitress==3.0.2",
    "Werkzeug==3.1.3",
]

[project.optional-dependencies]
cpu = [
    "fastai==2.8.4",
    "torch==2.8.0",
    "torchvision==0.23.0",
]
cuda = [
    "fastai==2.8.4",
    "torch==2.8.0",
    "torchvision==0.23.0",
]

[tool.uv]
package = false
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cuda" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cuda", extra = "cuda", marker = "sys_platform != 'darwin'" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cuda", extra = "cuda", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
